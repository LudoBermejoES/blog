<!--
  Terminal prompt mark. Original work, released CC0-1.0 — replaces the Astro
  logo that shipped with the starter template and was rendering in the browser
  tab on every page of this site.

  Self-contained dark tile rather than a bare glyph recoloured via
  prefers-color-scheme: the mark then keeps its own contrast against light and
  dark browser chrome alike. Strokes are deliberately heavy so the shapes
  survive downscaling to a 16px tab icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Terminal prompt">
  <rect x="3" y="3" width="122" height="122" rx="27" fill="#06121c" />
  <rect x="3" y="3" width="122" height="122" rx="27" fill="none" stroke="#1d4a63" stroke-width="6" />
  <path
    d="M41 40 L67 64 L41 88"
    fill="none"
    stroke="#7fe4ff"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect x="76" y="74" width="27" height="14" rx="4" fill="#7fe4ff" />
</svg>
